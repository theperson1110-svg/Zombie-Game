canvas{display:block;position:fixed;inset:0;cursor:none}

.bar{width:220px;height:14px;background:#0008;border:2px solid var(--bone)}

.big{font-family:var(--hd);font-weight:900;font-size:34px;line-height:1;letter-spacing:.02em}
.sm{font-size:14px;color:var(--dim)}
#ammo{position:fixed;right:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right;pointer-events:none}

#ov{position:fixed;inset:0;background:#080b0dee;display:none;overflow:auto;padding:24px;z-index:5}
#ov.show{display:block}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:var(--hd);font-weight:900;font-size:min(22vw,150px);line-height:.85;margin:6vh 0 12px;letter-spacing:-.01em}
h2{font-family:var(--hd);font-weight:900;font-size:34px;margin:22px 0 10px}
p{max-width:60ch;line-height:1.5}
button{font-family:var(--hd);font-weight:700;font-size:22px;background:var(--bone);color:#111;border:0;padding:10px 20px;cursor:pointer}
button:hover:not(:disabled){background:var(--flare)}button:focus-visible{outline:3px solid var(--flare);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{text-align:left;background:var(--panel);color:var(--bone);border:2px solid #34414a;padding:14px;font-family:var(--tx);font-size:15px;line-height:1.35}
.card b{display:block;font-family:var(--hd);font-size:26px;color:var(--flare);margin-bottom:4px}
.card:hover:not(:disabled){background:#243038;border-color:var(--flare);color:var(--bone)}
.card.got{border-color:var(--rot)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.k{color:var(--flare)}
#tut{position:fixed;inset:0;background:#080b0df5;z-index:9;display:none;overflow:auto;padding:22px}#tut.show{display:block}
#tut h2{margin:0 0 10px}#tut ul{margin:6px 0;padding-left:20px;line-height:1.5;font-size:15px}#tut li{margin:3px 0}

.sb{font-size:16px;padding:6px 12px}

else{ctx.globalAlpha=Math.min(1,q.l*3);ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-2,4,4);ctx.globalAlpha=1}}
for(const z of G.Z)drawZ(z,p);
for(const b of G.EB){ctx.fillStyle='#7fd3b0';ctx.beginPath();ctx.arc(b.x,b.y,6,0,6.283);ctx.fill()}
for(const b of G.B){if(b.fl){const ag=1-Math.min(1,b.l/.55);ctx.globalAlpha=.6*(1-ag*.6);ctx.fillStyle=ag<.4?'#ffd27a':'#ff7a2a';ctx.beginPath();ctx.arc(b.x,b.y,4+ag*11,0,6.283);ctx.fill();ctx.globalAlpha=1}
else{ctx.strokeStyle=b.ch>0?'#8fe3ff':b.cr?'#ffd27a':b.ex?'#ff8a3d':'#fff3c0';ctx.lineWidth=b.rk?4:b.ex?7:3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.03,b.y-b.vy*.03);ctx.stroke();if(b.ex){ctx.fillStyle='#ffb25a';ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.283);ctx.fill()}}}
drawP(p);
ctx.restore();
if(G.state==='play'){ctx.strokeStyle='#ffe9a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(M.x,M.y,11,0,6.283);ctx.moveTo(M.x-18,M.y);ctx.lineTo(M.x-7,M.y);ctx.moveTo(M.x+7,M.y);ctx.lineTo(M.x+18,M.y);ctx.moveTo(M.x,M.y-18);ctx.lineTo(M.x,M.y-7);ctx.moveTo(M.x,M.y+7);ctx.lineTo(M.x,M.y+18);ctx.stroke()}
if(G.flash>0){ctx.fillStyle=`rgba(200,40,30,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
if(G.fx.rage>0){ctx.strokeStyle='rgba(194,75,214,.5)';ctx.lineWidth=10;ctx.strokeRect(0,0,W,H)}
if(G.fx.freeze>0){ctx.fillStyle='rgba(108,199,255,.08)';ctx.fillRect(0,0,W,H)}}
function hud(){if(!G)return;const S=G.S,p=G.p,w=WEAPONS[p.cur],ws=G.wp[p.cur];
$('hp').style.width=Math.max(0,p.hp/S.hp*100)+'%';$('hpt').textContent=Math.ceil(p.hp)+' / '+S.hp+(p.dcd>0?'   dash '+p.dcd.toFixed(1)+'s'+(p.xc>0?' (+'+p.xc+' ready)':''):'   dash ready');
$('pts').textContent=G.pts+' pts';$('wave').textContent='Wave '+G.wave;$('kills').textContent=G.d.n+(spd>1?' · '+spd+'×':'')+' · '+G.kills+' kills · '+(G.Z.length+G.q)+' left';
$('ammo').innerHTML=`<div class="big">${w.n} Lv${ws.lvl}</div><div class="big" style="color:${ws.mag?'var(--bone)':'var(--blood)'}">${p.rl>0?'RELOADING':ws.mag+' / '+(ws.res===Infinity?'∞':ws.res)}</div><div class="sm">${G.own.map((o,i)=>o?(i===p.cur?'['+(i+1)+']':(i+1)):'').join(' ')}</div>`;
$('fx').innerHTML=[['rage','Rage','#c24bd6'],['freeze','Freeze','#6cc7ff'],['turret','Turret','#e8e2d0'],['surge','Ammo surge','#d8c04a']].filter(f=>G.fx[f[0]]>0).map(f=>`<span style="color:${f[2]}">${f[1]} ${G.fx[f[0]].toFixed(1)}s</span>`).join('<br>')+(G.p.bl>0?'<br><span style="color:var(--blood)">Bloodlust ×'+G.p.bl+'</span>':'')+(G.p.fr>0?'<br><span style="color:var(--flare)">Frenzy '+G.p.fr.toFixed(1)+'s</span>':'')}
function loop(t){const b=Math.min(.033,(t-last)/1000);last=t;if(G&&G.state==='play'){const n=Math.ceil(spd);for(let i=0;i<n&&G.state==='play';i++)update(b*spd/n)}draw();hud();requestAnimationFrame(loop)}

PERKS.forEach(k=>{const c=CL[k.id];if(!c)return;k.d=c[0];if(c[1]){k.syn=c[1];k.a=c[2]}else{delete k.syn;delete k.a}});
const WI={'Pistol':['Reliable starter; bullets pierce 1 zombie.','low damage output in big crowds.'],
'SMG':['Fast and steady, pierces 1, loves fire-rate perks.','low damage per hit, struggles vs Riot armor.'],
'Shotgun':['Huge damage up close, pellets pierce 1 zombie.','falls off at range, slow shots.'],
'Rail Rifle':['Pierces lines of zombies, hits harder at range, great vs bosses.','slow shots, tiny magazine.'],
'Launcher':['Splash damage clears groups and ignores armor.','slow shots, small magazine, slow rockets.'],
'Arc Gun':['Lightning chains to 3 nearby zombies at 60% damage.','short range, needs zombies close together.'],
'Flamethrower':['Ignites everything it hits and pierces 5; fire ignores armor and shields.','short range (350px), so ranged enemies can out-range you.'],
'Minigun':['Spins up to 2.2\u00d7 fire rate with a huge magazine.','slow start, low damage per bullet, long reload.']};
function wst(i){const w=WEAPONS[i],s=G.S,lv=G.wp[i].lvl,m=(1+.25*Math.min(lv,5)+.15*Math.max(0,lv-5))*s.dmg*s.wd[i],rt=Math.max(.05,w.rate/1000/(s.rate*s.wr[i])),pel=w.pel+s.wx[i],mg=mag(i),rl=w.rl*s.rel*s.wl[i]/1000,dm=w.dmg*m,dps=dm*pel*mg/(mg*rt+rl);
return 'Damage '+Math.round(dm)+(pel>1?' \u00d7'+pel:'')+' \u00b7 '+(1/rt).toFixed(1)+' shots/s \u00b7 Mag '+mg+' \u00b7 Reload '+rl.toFixed(1)+'s \u00b7 Range '+Math.round(w.spd*w.life)+'px \u00b7 Pierce '+(w.pierce+s.wp[i])+(w.expl?' \u00b7 Blast '+Math.round(w.expl*s.wb[i])+'px':'')+(w.chain||s.wch[i]?' \u00b7 Chains '+((w.chain||0)+s.wch[i]):'')+' \u00b7 ~'+Math.round(dps)+' DPS'}
function spdHtml(){return [1,1.25,1.5,2].map(x=>'<button class="sb" style="'+(x===spd?'background:var(--flare)':'')+'" onclick="setSpd('+x+')">'+x+'\u00d7</button>').join('')}
function setSpd(x){spd=x;const e=$('spdrow');if(e)e.innerHTML=spdHtml();if(G&&G.state==='shop')renderShop()}
// ---- tutorial
let tutI=0;
const zt=(t,n,d,k,e)=>'<div class="tz"><canvas class="zs" width="84" height="92" data-z="'+t+'" data-k="'+(k||0)+'" data-e="'+(e||'')+'"></canvas><div><b class="k">'+n+'</b> '+d+'</div></div>';
const dot=(c,t)=>'<li><span class="dot" style="background:'+c+'"></span>'+t+'</li>';
const TUT=[
['The goal',()=>'<ul><li>Survive wave after wave. Every kill earns <b>points</b>. Waves get bigger, tougher and faster, and every 5th wave is a <b>boss</b>.</li><li>Clear a wave and the <b>shop</b> opens: pick 1 perk, spend points, start the next wave.</li></ul><h2>The screen</h2><ul><li><b>Top left:</b> HP bar, dash status, points.</li><li><b>Top right:</b> wave, difficulty and speed, kills, zombies left.</li><li><b>Bottom right:</b> your gun, its level, ammo, and the numbers of guns you own.</li><li><b>Bottom left:</b> active effects (Rage, Freeze, Turret, Ammo surge, Bloodlust, Frenzy).</li><li><b>Center:</b> banners announce waves, bosses and new enemy types.</li></ul>'],
['Move, aim, shoot, reload',()=>'<ul><li><b>WASD</b> move. <b>Mouse</b> aim (yellow crosshair). <b>Hold left click</b> to shoot.</li><li>Ammo is unlimited, but every magazine must be reloaded. It <b>reloads automatically</b> when empty. Press <b>R</b> to reload early. A yellow ring around you shows progress, and you cannot shoot while it fills.</li><li><b>1\u20138</b> switch to any gun you own (this cancels a reload).</li><li>Keep moving while you shoot: standing still is how you get surrounded.</li></ul>'],
['Dash',()=>'<ul><li>Press <b>Shift</b> or <b>Space</b>.</li><li><b>Direction:</b> you dash the way you are holding <b>WASD</b> (diagonals work). If you are <b>not</b> holding a move key, you dash <b>toward your cursor</b>.</li><li>You are <b>invulnerable for 0.4s</b> while dashing. Wraith hits still land.</li><li>Cooldown is <b>3s</b>; the top-left HUD shows "dash ready" or the countdown. Perks add extra dashes, shockwaves, slowing, and damage.</li></ul>'],
['Items dropped by zombies',()=>'<p>Glowing orbs drop from kills (more from brutes, always 3 from bosses) and vanish after 16s. Walk over them.</p><ul>'+dot('#e8493f','<b>+ Medkit</b>: heal 40 HP.')+dot('#d8c04a','<b>A Ammo Surge</b>: instant full magazine and no ammo use for 7s.')+dot('#6fd08c','<b>$ Cash</b>: bonus points.')+dot('#ff8a3d','<b>N Nuke</b>: hits every zombie for 60% of its max HP (25% for bosses).')+dot('#c24bd6','<b>R Rage</b>: double damage for 10s.')+dot('#6cc7ff','<b>F Freeze</b>: zombies move at 20% speed for 7s and cannot hit you. Wraiths ignore it.')+dot('#e8e2d0','<b>T Turret</b>: an auto-turret fires at nearby zombies for 14s.')+'</ul>'],
['Zombies (1/2)',()=>zt('walker','Walker','Basic and slow. Free points, but they swarm.')+zt('runner','Runner','Fast and fragile. Shoot them first; they outrun you late.')+zt('brute','Brute','Huge health, hits hard, slow. Kite it and focus it down. Drops items often.')+zt('spitter','Spitter','Keeps its distance and spits acid every ~2s. Dash through the shots or kill it from range.')],
['Zombies (2/2)',()=>'<div class="pg"><div>'+zt('bloater','Bloater','Pops when killed: 18 damage if you are within 100px. Kill it at range.')+zt('leaper','Leaper','Flashes pale, then lunges at you. Sidestep or dash.')+zt('riot','Riot','Armored: bullets deal 50% less. Use fire, explosions, dash shockwaves or Armor Piercing.')+'</div><div>'+zt('hive','Hive','Splits into 3 fast crawlers when killed. Explosions clean them up.')+zt('necro','Necromancer','Stays back and summons 2 walkers every 6s. Kill it first.')+zt('wraith','Wraith','Blinks next to you and hits through dash invulnerability. Immune to Freeze, Dash Strike and Time Dilation. Shoot it down fast.')+'</div></div>'],
['Elites and bosses',()=>'<h2>Elites (from wave 20)</h2><ul><li><b style="color:#4fd8ff">Cyan ring:</b> shielded. The shield soaks 80% of its health in damage first. Fire ignores shields.</li><li><b style="color:#ffd23a">Yellow trails:</b> swift, 35% faster.</li><li><b style="color:#5dff7a">Green glow:</b> regenerates 3% health per second. Burst it down.</li></ul><h2>Bosses (every 5th wave, rotating)</h2><div class="pg"><div>'+zt('boss','Abomination','Summons walkers and runners.',0)+zt('boss','Juggernaut','Armored (40% less bullet damage) and charges at you.',1)+'</div><div>'+zt('boss','Warlock','Keeps its distance and fires 5-bolt volleys.',2)+zt('boss','Brood Mother','Spawns crawlers constantly and bursts into 8 more.',3)+'</div></div><p class="sm">Late waves also add a % of your max HP to every hit.</p>'],
['Weapons',()=>'<p class="sm">Every gun costs 400 points (Pistol is free). Ammo is unlimited. Each can be upgraded to level 12 and has its own perks.</p><ul>'+WEAPONS.map(w=>'<li><b class="k">'+w.n+'</b>: '+WI[w.n][0]+' <span class="sm">Weak: '+WI[w.n][1]+'</span></li>').join('')+'</ul>'],
['Perks, points and the shop',()=>'<ul><li><b>Perks:</b> after each wave pick 1 of 4. Most stack, up to a cap shown by the build line. Perk types you keep skipping appear less often (never never). Cards with a <b>Bonus</b> line have a real extra effect when you own the named gun or perk.</li><li><b>Armory:</b> buy guns, upgrade levels (+25% damage to level 5, then +15% each to 12).</li><li><b>Reroll:</b> one per shop, before you pick. <b>Patch up:</b> +25% HP, once per shop, price climbs.</li><li><b>Black Market:</b> permanent damage, fire rate and HP, extra perk picks (2 per shop), and an Emergency revive. Prices climb with every purchase.</li><li><b>Speed:</b> choose 1\u00d7, 1.25\u00d7, 1.5\u00d7 or 2\u00d7 on the title screen or in the shop. Everything runs faster.</li><li>Open this guide again any time from the title screen or the shop.</li></ul>']];
function showTut(i){tutI=i||0;$('tut').className='show';renderTut()}
function hideTut(){$('tut').className='';try{localStorage.setItem('dl_tut','1')}catch(e){}}
function tutGo(d){tutI=Math.max(0,Math.min(TUT.length-1,tutI+d));renderTut()}
function renderTut(){const [t,f]=TUT[tutI],last=tutI===TUT.length-1;
$('tut').innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between"><span class="sm">How to play \u00b7 '+(tutI+1)+' / '+TUT.length+'</span><button class="sb" onclick="hideTut()">Skip tutorial</button></div><h2 style="font-size:44px;margin-top:6px">'+t+'</h2>'+f()+'<div class="row" style="margin-top:18px"><button '+(tutI?'':'disabled')+' onclick="tutGo(-1)">Back</button><button onclick="'+(last?'hideTut()':'tutGo(1)')+'">'+(last?'Let\u2019s play':'Next')+'</button></div></div>';
for(const c of $('tut').querySelectorAll('canvas[data-z]'))sprite(c)}
function sprite(c){const t=c.dataset.z,bk=+c.dataset.k||0,e=c.dataset.e,sx=c.getContext('2d'),sc=ctx,sg=G,b=ZT[t],r=Math.min(b.r,t==='boss'?30:25);ctx=sx;G={t:1.3,fx:{freeze:0,rage:0,turret:0,surge:0}};
try{sx.clearRect(0,0,c.width,c.height);drawZ({x:40,y:46,r,t,c:t==='boss'?['#7a4560','#8a5a2a','#3a5aa0','#a04a6a'][bk]:b.c,spd:b.spd,hp:1,max:1,fl:0,slow:0,burn:0,bk,shd:e==='s'?1:0,af:e==='w'?1:e==='r'?2:0},{x:300,y:46})}finally{ctx=sc;G=sg}}
addEventListener('keydown',e=>{if(!$('tut').className)return;if(e.key==='Escape')hideTut();if(e.key==='ArrowRight')tutGo(1);if(e.key==='ArrowLeft')tutGo(-1)});
try{if(!localStorage.getItem('dl_tut'))showTut(0)}catch(e){showTut(0)}
requestAnimationFrame(loop);
</script></body></html>
